            mkdir -p /tmp/col
            { set +o pipefail 2>/dev/null; VERSION="don't panic"; printf '%s\n' "${VERSION#* }"; true ; } > /tmp/col/glyph379
            echo "disk-$(du -b /tmp/col/glyph379 | awk '{print $1}')"
      - persist_to_workspace:
          root: /tmp/col
          paths:
            - 'glyph379'
